[project]
name = "epiphany-for-procurenet"
version = "1.0.0"
description = "ePiphany: rewrites WooCommerce product listings (descriptions, SEO title, meta description, focus keyword, tags, categories) with OpenAI, and records the results in PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "nh3>=0.2.18",
]

[project.scripts]
epiphany = "epiphany.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epiphany"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=epiphany --cov-report=term-missing"
markers = ["postgres: needs TEST_DATABASE_URL (a PostgreSQL the tests may create tables in)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
